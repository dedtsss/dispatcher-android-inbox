name: Проверка reboot восстановления очереди (изолированный тест)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reboot-recovery:
    name: Debug instrumentation, seed и настоящий reboot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Получить исходники test-only ref
        uses: actions/checkout@v4

      - name: Подготовить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Подготовить Android SDK
        uses: android-actions/setup-android@v4

      - name: Установить Android SDK 35
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Собрать только debug app и instrumentation APK
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Разрешить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Проверить сохранение очереди после настоящего reboot AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell svc wifi disable
            adb shell svc data disable
            timeout 120s adb shell am instrument -w -e class 'ru.bruce.dispatcherinbox.WorkRebootRecoveryTest#seedBeforeReboot' ru.bruce.dispatcherinbox.test/androidx.test.runner.AndroidJUnitRunner | tee reboot-seed.txt
            grep -q 'OK (' reboot-seed.txt
            adb reboot
            adb wait-for-device
            timeout 120s bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            timeout 120s adb shell am instrument -w -e class 'ru.bruce.dispatcherinbox.WorkRebootRecoveryTest#verifyAfterRebootWithoutManualSchedule' ru.bruce.dispatcherinbox.test/androidx.test.runner.AndroidJUnitRunner | tee reboot-verify.txt
            grep -q 'OK (' reboot-verify.txt
