name: Диагностика готового APK на Android

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Запуск сборки с артефактом проверки-на-устройстве
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  device:
    name: Проверка готовых APK с диагностикой
    runs-on: ubuntu-latest
    steps:
      - name: Получить готовые APK
        uses: actions/download-artifact@v4
        with:
          name: проверка-на-устройстве
          path: apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Разрешить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Выполнить проверки и сохранить диагностику
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r apk/debug/app-debug.apk
            adb install -r apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant ru.bruce.dispatcherinbox android.permission.RECORD_AUDIO
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am instrument -w -e class ru.bruce.dispatcherinbox.CaptureIntegrationTest,ru.bruce.dispatcherinbox.MigrationTest ru.bruce.dispatcherinbox.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            adb logcat -d > logcat.txt
            adb shell dumpsys activity exit-info ru.bruce.dispatcherinbox > exit-info.txt
            adb pull /sdcard/Android/data/ru.bruce.dispatcherinbox/files/catching-evidence ./evidence || true
            grep -q 'OK (' instrumentation.txt
      - name: Опубликовать диагностику
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: диагностика-Android
          path: |
            instrumentation.txt
            logcat.txt
            exit-info.txt
            evidence/
          retention-days: 3
